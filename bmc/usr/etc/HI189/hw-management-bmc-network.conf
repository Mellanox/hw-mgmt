#
# BMC usb0 link to host CPU (systemd-networkd).
# Installed as /etc/hw-management-bmc-usb0.conf by hw-management-bmc-plat-specific-preps.
#
# USB0_MODE:
#   dhcp   - DHCPv4 client (default; matches OpenBMC). Host offers 169.254.100.1.
#   static - use USB0_ADDRESS
#   none   - do not write a .network unit
# USB0_MANAGED_BY_NOS=1 is an alias for none (see SONIC_USB0_INTEGRATION.md).
USB0_MODE=dhcp
# USB0_ADDRESS=169.254.100.1/16
