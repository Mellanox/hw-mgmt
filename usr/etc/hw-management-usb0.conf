#
# Host (CPU) usb0 link to the BMC (switch / SONiC default).
# Applied by hw-management-ifupdown.sh on USB net add unless NOS owns usb0
# (see USB0_MANAGED_BY_NOS / SONiC contract).
#
# A file at /etc/<SKU>/hw-management-usb0.conf overrides this.
# GB200 / GB300 / NBU-VR (HI162 HI166 HI167 HI168 HI169 HI170 HI175
# HI176 HI177 HI180 HI185 HI197) keep 10.0.1.2/24 and USB0_DHCP_SERVER=0.
#
# USB0_ADDRESS      - this host's usb0 CIDR (default matches SONiC bmc_if_addr)
# USB0_BMC_ADDRESS  - BMC address offered by the optional DHCP server
# USB0_DHCP_SERVER  - 1/yes/true: run dnsmasq on usb0 so OpenBMC / DHCP BMC clients get USB0_BMC_ADDRESS
# USB0_MANAGED_BY_NOS - 1/yes/true: do not assign an address (same as /etc/bmc-network-sonic.conf)
USB0_ADDRESS=169.254.100.2/16
USB0_BMC_ADDRESS=169.254.100.1
USB0_DHCP_SERVER=1
# USB0_MANAGED_BY_NOS=1
