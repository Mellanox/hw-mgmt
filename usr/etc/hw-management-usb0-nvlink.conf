#
# Host usb0 for GB200 / GB300 / NBU-VR (not used with SONiC).
# OpenBMC on these systems stays static 10.0.1.1/24 (no DHCP).
# Packaged as /etc/<HID>/hw-management-usb0.conf and overrides
# /etc/hw-management-usb0.conf.
#
# HIDs: HI162 HI166 HI167 HI168 HI169 HI170 HI175 HI176 HI177 HI180 HI185 HI197
USB0_ADDRESS=10.0.1.2/24
USB0_BMC_ADDRESS=10.0.1.1
USB0_DHCP_SERVER=0
