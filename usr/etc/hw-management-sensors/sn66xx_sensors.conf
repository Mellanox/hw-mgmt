# Management board DDR voltage regulator
chip "mp2975-i2c-*-6a"
    label in1 "DDR PMIC VDD_MEM Volt (in)"
    label in2 "DDR PMIC VDD_MEMIO Volt (out1)"
    label in3 "DDR PMIC VDD_MEM Volt (out2)"
    label temp1 "DDR PMIC VDD_MEM Phase Temp"
    label power1 "DDR PMIC VDD_MEM Pwr (in)"
    label power2 "DDR PMIC VDD_MEMIO Pwr (out1)"
    label power3 "DDR PMIC VDD_MEM Pwr (out2)"
    label curr1 "DDR PMIC VDD_MEM Curr (in)"
    label curr2 "DDR PMIC VDD_MEM Curr (out)"
    ignore curr3
    ignore curr4
    ignore curr5
    ignore curr6

# Management board DDR temperature sensors
chip "jc42-i2c-*-52"
    label temp1 "SODIMM1 Temp"

chip "jc42-i2c-*-53"
    label temp1 "SODIMM2 Temp"

# Management board DDR5 temperature sensors
chip "spd5118-i2c-*-52"
    label temp1 "SODIMM1 Temp"

chip "spd5118-i2c-*-53"
    label temp1 "SODIMM2 Temp"

# AMD CPU temperature sensor
chip "k10temp-pci-*"
    label temp1 "CPU Package Temp"
    label temp2 "CPU Die0 Temp"

# AMD CPU ACPI temperature sensor
chip "*-acpi-*"
    label temp1 "CPU ACPI temp"

# NVME SSD temperature sensor
chip "nvme-pci-*"
    label temp1 "SSD Temp"
    ignore temp2
    ignore temp3

# Ethernet PHY temperature sensors
chip "*-mdio-*"
   ignore temp1
